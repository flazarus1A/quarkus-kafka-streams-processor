quarkus.kafka-streams.application-id=pingapp
kafkastreamsprocessor.input.topic=ping-events
kafkastreamsprocessor.output.topic=pong-events
kafkastreamsprocessor.global-stores.topics.ping-data=global-data-topic
quarkus.kafka-streams.topics=ping-events,pong-events,global-data-topic
quarkus.kafka.devservices.topic-partitions.ping-events=1
quarkus.kafka.devservices.topic-partitions.pong-events=1
quarkus.kafka.devservices.topic-partitions.global-data-topic=1
# Runs native test with test profile https://github.com/quarkusio/quarkus/issues/4371
quarkus.test.native-image-profile=test
quarkus.kafka.devservices.provider=kafka-native